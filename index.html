async function cloudSignIn(){rememberCloudEmail();const email=$('cloudEmail').value.trim(),password=$('cloudPassword').value;if(!email||!password)return cloudMessage('Isi email dan password.');cloudMessage('Sedang masuk...');const {data,error}=await cloudClient.auth.signInWithPassword({email,password});if(error)return cloudMessage(error.message);await afterCloudLogin(data.user);}
async function cloudSignUp(){rememberCloudEmail();const email=$('cloudEmail').value.trim(),password=$('cloudPassword').value;if(!email||password.length<6)return cloudMessage('Isi email dan password minimal 6 karakter.');cloudMessage('Membuat akun...');const {data,error}=await cloudClient.auth.signUp({email,password});if(error)return cloudMessage(error.message);if(!data.session){cloudMessage('Akun dibuat. Periksa email untuk konfirmasi, lalu kembali dan tekan Masuk.');return;}await afterCloudLogin(data.user);}
async function afterCloudLogin(user){cloudUser=user;cloudLoading=true;cloudMessage('Mengambil data online...');try{const {data,error}=await cloudClient.from('app_state').select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data?.data){db={...blank,...data.data,settings:{...blank.settings,...(data.data.settings||{})}};try{localStorage.setItem(K,JSON.stringify(db));}catch(cacheError){console.warn('Cache browser penuh; data tetap dimuat dari database online.',cacheError);}}else{await cloudSaveNow();}cloudReady=true;$('cloudLogin').style.display='none';$('app').style.display='';render();cloudMessage('');}catch(e){cloudMessage('Gagal memuat database online: '+e.message);}finally{cloudLoading=false;}}
async function cloudSaveNow(){if(!cloudUser||!cloudClient)return;const payload={user_id:cloudUser.id,data:db,updated_at:new Date().toISOString()};const {error}=await cloudClient.from('app_state').upsert(payload,{onConflict:'user_id'});if(error)throw error;}

async function uploadPhotoToStorage(file,folder){
  if(!file)return '';
  if(!cloudUser||!cloudClient)throw new Error('Silakan login terlebih dahulu.');
  if(!file.size)throw new Error('File foto kosong. Pilih foto lain dari Galeri atau File.');
  if(file.size>15*1024*1024)throw new Error('Ukuran foto lebih dari 15 MB. Pilih foto yang lebih kecil.');
  let bitmap=null,objectUrl=null,uploadBlob=file,contentType=file.type||'image/jpeg',extension=(file.name||'foto.jpg').split('.').pop().toLowerCase();
  try{
    // Coba kompres untuk menghemat kuota. Jika browser tablet gagal membaca JPG,
    // unggah file aslinya tanpa memaksa browser mendekode gambar terlebih dahulu.
    try{
      if('createImageBitmap' in window) bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
      let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      if(bitmap){const scale=Math.min(1,1200/Math.max(bitmap.width,bitmap.height));canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();bitmap=null;}
      else {objectUrl=URL.createObjectURL(file);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Tidak dapat membaca gambar untuk kompresi'));img.src=objectUrl;});const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));ctx.drawImage(img,0,0,canvas.width,canvas.height);}
      uploadBlob=await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Kompresi gagal')),'image/jpeg',0.78));contentType='image/jpeg';extension='jpg';
    }catch(decodeError){uploadBlob=file;contentType=file.type||'image/jpeg';}
    const safeName=(file.name||'foto').replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'');
    const ext=['jpg','jpeg','png','webp','gif'].includes(extension)?extension:'jpg';
    const path=`${cloudUser.id}/${folder}/${Date.now()}-${safeName}.${ext}`;
    const {error}=await cloudClient.storage.from('boo-gift-house-files').upload(path,uploadBlob,{contentType,upsert:false});
    if(error)throw error;
    return cloudClient.storage.from('boo-gift-house-files').getPublicUrl(path).data.publicUrl;
  }finally{if(bitmap)bitmap.close?.();if(objectUrl)URL.revokeObjectURL(objectUrl);}
}

function dl(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function exportExcel(){let rows=[['Tanggal','Nama pembeli','WhatsApp','Produk','Qty','Harga satuan','Ongkir','Total','Pembayaran','Status','DP','Sisa','Pengiriman','Tanggal ambil/kurir','Nama penerima','HP penerima','Alamat','Catatan'],...db.orders.map(o=>[new Date(o.date).toLocaleDateString('id-ID'),o.buyer,o.wa,o.product,o.qty,o.price,o.shipping,o.total,o.pay,o.status,o.dp,o.total-o.dp,o.delivery,o.pickupDate,o.recipient,o.recipientPhone,o.address,o.address])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),'data-pembeli-boo-gift-house.csv')}
function financeInit(){if(!db.finance||typeof db.finance!=='object')db.finance={openingCapital:0,entries:[],savingsWithdrawals:[]};if(!Array.isArray(db.finance.entries))db.finance.entries=[];if(!Array.isArray(db.finance.savingsWithdrawals))db.finance.savingsWithdrawals=[];if(!Number.isFinite(+db.finance.openingCapital))db.finance.openingCapital=0;}
function financeHpp(o){let p=db.products.find(x=>productLabel(x)===o.product),v=+(p?.hpp||0);if(!v){let rec=(db.hppRecords||[]).filter(x=>String(x.name||'').trim().toLowerCase()===String(o.product||'').trim().toLowerCase()).slice(-1)[0];v=+(rec?.hpp||0);}return Math.max(0,v)*(+o.qty||1)}
function financeNumbers(){financeInit();let valid=db.orders.filter(o=>!['batal','dibatalkan','cancel','cancelled'].includes(String(o.status||'').toLowerCase()));let status=o=>String(o.status||'').toLowerCase();let paid=valid.reduce((a,o)=>a+(status(o)==='lunas'?Math.max(0,+o.total||0):status(o)==='dp'?Math.max(0,Math.min(+o.total||0,+o.dp||0)):0),0);let lunas=valid.filter(o=>status(o)==='lunas');let revenue=lunas.reduce((a,o)=>a+Math.max(0,+o.total||0),0),hpp=lunas.reduce((a,o)=>a+financeHpp(o),0),ops=db.finance.entries.filter(x=>x.kind==='Operasional').reduce((a,x)=>a+(+x.amount||0),0),stock=db.finance.entries.filter(x=>x.kind==='Pembelian stok').reduce((a,x)=>a+(+x.amount||0),0),prive=db.finance.entries.filter(x=>x.kind==='Prive').reduce((a,x)=>a+(+x.amount||0),0),capital=db.finance.entries.filter(x=>x.kind==='Tambahan modal').reduce((a,x)=>a+(+x.amount||0),0),profit=revenue-hpp-ops,savingsGross=Math.max(0,profit),withdrawals=db.finance.savingsWithdrawals.reduce((a,x)=>a+(+x.amount||0),0),savings=Math.max(0,savingsGross-withdrawals),cash=(+db.finance.openingCapital||0)+paid+capital-stock-ops-prive-savingsGross,receivable=valid.reduce((a,o)=>a+(status(o)==='dp'?Math.max(0,(+o.total||0)-(+o.dp||0)):status(o)==='belum dibayar'?Math.max(0,+o.total||0):0),0),missing=lunas.filter(o=>financeHpp(o)===0).length;return{revenue,hpp,ops,stock,prive,capital,profit,savings,savingsGross,withdrawals,cash,receivable,missing,paid,openingCapital:+db.finance.openingCapital||0,lunasCount:lunas.length}}
function addFinanceEntry(){financeInit();let kind=$('fkind').value,desc=$('fdesc').value.trim(),amount=rupiahInput($('famount').value);if(!desc||amount<=0)return alert('Isi keterangan dan jumlah dengan benar.');if(kind==='Pembelian stok'&&amount>financeNumbers().cash)return alert('Pembelian melebihi kas modal usaha yang tersedia.');db.finance.entries.push({id:'fe'+Date.now(),date:new Date().toISOString(),kind,desc,amount});save();render()}

async function backup(){
  const json=JSON.stringify(db,null,2);
  const filename='backup-boo-baby-hampers-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([json],filename,{type:'application/json'});
  try{
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Backup Boo Gift House',text:'Cadangan data aplikasi Boo Gift House'});
      return;
    }
  }catch(e){if(e && e.name==='AbortError')return;}
  const blob=new Blob([json],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function restoreData(){let f=$('restore').files[0];if(!f)return alert('Pilih file backup');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.materials||!d.orders)throw 0;db=d;save();render();alert('Backup dipulihkan')}catch(e){alert('File backup tidak valid')}};r.readAsText(f)}
